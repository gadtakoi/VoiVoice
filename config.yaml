app:
  name: "VoiVoice"
  version: "0.1.0"

hotkey:
  combination: "ctrl+alt+v"
  hold_to_record: true

audio:
  sample_rate: 16000
  channels: 1
  dtype: "int16"
  chunk_duration_ms: 30
  vad_threshold: 0.5
  silence_timeout_ms: 500
  max_duration_ms: 60000

services:
  api_url: "http://localhost:8080"
  asr_model: "base"
  llm_model: "llama3.2:3b"
  cleanup_enabled: true
  fallback_to_raw: true

tray:
  show_notifications: true
  startup_minimized: false

injection:
  method: "sendinput"
  delay_between_chars_ms: 10

logging:
  level: "INFO"
  format: "json"
  directory: "./logs"
  rotation_mb: 10
  retention_days: 7

retry:
  asr:
    max_attempts: 3
    base_delay: 0.5
    multiplier: 2.0
  llm:
    max_attempts: 2
    base_delay: 1.0
    multiplier: 2.0
