version: "3.8"

services:
  asr:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: voivoice-asr
    ports:
      - "8000:8000"
    volumes:
      - ./models/whisper:/models:ro
    environment:
      - WHISPER_MODEL=base
      - WHISPER_LANGUAGE=ru
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_CPU_THREADS=4
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  llm:
    image: ollama/ollama
    container_name: voivoice-llm
    ports:
      - "11434:11434"
    volumes:
      - ./models/ollama:/root/.ollama
    environment:
      - OLLAMA_NUM_THREADS=0
      - OLLAMA_USE_MLOCK=true
      - OLLAMA_FLASH_ATTENTION=1
    deploy:
      resources:
        limits:
          memory: 3G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  languagetool:
    image: erikvl87/languagetool:latest
    container_name: voivoice-languagetool
    ports:
      - "8010:8010"
    environment:
      - Java_Xms=512m
      - Java_Xmx=1g
    deploy:
      resources:
        limits:
          memory: 1.5G
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/server/Dockerfile
    container_name: voivoice-api
    ports:
      - "8080:8080"
    environment:
      - ASR_URL=http://asr:8000
      - LLM_URL=http://llm:11434
      - LT_URL=http://languagetool:8010
      - LOG_LEVEL=INFO
    depends_on:
      - asr
      - llm
      - languagetool
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
